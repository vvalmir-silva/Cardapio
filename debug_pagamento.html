<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Página de Pagamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Debug - Página de Pagamento</h1>
        
        <div class="bg-white p-4 rounded-lg shadow mb-4">
            <h2 class="text-lg font-semibold mb-2">Informações da URL</h2>
            <div id="urlInfo"></div>
        </div>
        
        <div class="bg-white p-4 rounded-lg shadow mb-4">
            <h2 class="text-lg font-semibold mb-2">Dados do Pedido</h2>
            <div id="orderInfo"></div>
        </div>
        
        <div class="bg-white p-4 rounded-lg shadow mb-4">
            <h2 class="text-lg font-semibold mb-2">Console Logs</h2>
            <div id="consoleLogs" class="bg-black text-green-400 p-2 rounded font-mono text-sm max-h-96 overflow-y-auto"></div>
        </div>
        
        <div class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-2">Ações</h2>
            <button onclick="testRedirect()" class="bg-blue-500 text-white px-4 py-2 rounded mr-2 mb-2">Testar Redirecionamento</button>
            <button onclick="clearLogs()" class="bg-red-500 text-white px-4 py-2 rounded mr-2 mb-2">Limpar Logs</button>
            <button onclick="saveTestData()" class="bg-green-500 text-white px-4 py-2 rounded mr-2 mb-2">Salvar Dados Teste</button>
            <button onclick="checkLocalStorage()" class="bg-purple-500 text-white px-4 py-2 rounded mb-2">Verificar LocalStorage</button>
            <button onclick="clearLocalStorage()" class="bg-orange-500 text-white px-4 py-2 rounded mb-2">Limpar LocalStorage</button>
        </div>
    </div>

    <script>
        // Capturar todos os console.log
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addToConsole(type, ...args) {
            const logDiv = document.getElementById('consoleLogs');
            const timestamp = new Date().toLocaleTimeString();
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            
            logDiv.innerHTML += `<div>[${timestamp}] ${type}: ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        console.log = function(...args) {
            addToConsole('LOG', ...args);
            originalLog.apply(console, args);
        };
        
        console.error = function(...args) {
            addToConsole('ERROR', ...args);
            originalError.apply(console, args);
        };
        
        console.warn = function(...args) {
            addToConsole('WARN', ...args);
            originalWarn.apply(console, args);
        };
        
        // Load order data from localStorage PRIMEIRO
        function loadPageInfo() {
            console.log('=== PÁGINA DE DEBUG CARREGADA ===');
            
            // Informações da URL
            const urlDiv = document.getElementById('urlInfo');
            urlDiv.innerHTML = `
                <p><strong>URL atual:</strong> ${window.location.href}</p>
                <p><strong>Protocolo:</strong> ${window.location.protocol}</p>
                <p><strong>Host:</strong> ${window.location.host}</p>
                <p><strong>Pathname:</strong> ${window.location.pathname}</p>
                <p><strong>Search:</strong> ${window.location.search}</p>
                <p><strong>Hash:</strong> ${window.location.hash}</p>
            `;
            
            // TENTAR CARREGAR DO LOCALSTORAGE PRIMEIRO
            let orderData = null;
            let dataSource = '';
            
            try {
                console.log('Verificando localStorage...');
                const localStorageData = localStorage.getItem('paymentOrderData');
                console.log('Dados no localStorage:', !!localStorageData);
                
                if (localStorageData) {
                    console.log('Dados encontrados no localStorage!');
                    orderData = JSON.parse(localStorageData);
                    dataSource = 'localStorage';
                }
            } catch (error) {
                console.error('Erro ao ler localStorage:', error);
            }
            
            // SE NÃO ENCONTROU NO LOCALSTORAGE, TENTAR DA URL
            if (!orderData) {
                console.log('Tentando carregar da URL...');
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const orderDataParam = urlParams.get('order');
                    
                    console.log('Order data param encontrado:', !!orderDataParam);
                    
                    if (orderDataParam) {
                        console.log('Tentando fazer parse...');
                        orderData = JSON.parse(decodeURIComponent(orderDataParam));
                        dataSource = 'URL';
                    }
                } catch (error) {
                    console.error('Erro ao processar dados da URL:', error);
                }
            }
            
            // EXIBIR DADOS DO PEDIDO
            if (orderData) {
                console.log('Order data carregado de', dataSource + ':', orderData);
                
                const orderDiv = document.getElementById('orderInfo');
                orderDiv.innerHTML = `
                    <p><strong>Fonte dos dados:</strong> ${dataSource}</p>
                    <p><strong>Pedido ID:</strong> ${orderData.pedidoId}</p>
                    <p><strong>Total:</strong> R$ ${orderData.total?.toFixed(2)}</p>
                    <p><strong>Nome:</strong> ${orderData.nome}</p>
                    <p><strong>Método:</strong> ${orderData.paymentMethod}</p>
                    <p><strong>Itens:</strong> ${orderData.items?.length || 0}</p>
                    <details>
                        <summary>Ver dados completos</summary>
                        <pre class="bg-gray-100 p-2 rounded text-xs overflow-x-auto">${JSON.stringify(orderData, null, 2)}</pre>
                    </details>
                `;
            } else {
                console.error('NENHUM DADO DO PEDIDO ENCONTRADO!');
                document.getElementById('orderInfo').innerHTML = '<p class="text-red-500">Nenhum dado de pedido encontrado (nem localStorage nem URL)</p>';
            }
            
            console.log('=== FIM DO CARREGAMENTO ===');
        }
        
        function testRedirect() {
            console.log('Testando redirecionamento manual...');
            const testData = {
                pedidoId: 'TEST123',
                items: [{nome: 'Test Item', preco: 1.50, quantidade: 1}],
                total: 1.50,
                nome: 'Test User',
                paymentMethod: 'pix'
            };
            
            const url = `pagamento.html?order=${encodeURIComponent(JSON.stringify(testData))}`;
            console.log('URL de teste gerada:', url);
            
            // Não redirecionar, apenas mostrar
            alert('URL de teste: ' + url);
        }
        
        function clearLogs() {
            document.getElementById('consoleLogs').innerHTML = '';
        }
        
        function saveTestData() {
            console.log('Salvando dados de teste no localStorage...');
            const testData = {
                pedidoId: 'TEST123',
                items: [{nome: 'Pastel de Queijo', preco: 1.5, quantidade: 1}],
                total: 1.5,
                nome: 'Test User',
                paymentMethod: 'pix'
            };
            
            try {
                localStorage.setItem('paymentOrderData', JSON.stringify(testData));
                console.log('Dados de teste salvos com sucesso:', testData);
                console.log('Recarregando página para testar...');
                
                // Recarregar após 1 segundo para ver os logs
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } catch (error) {
                console.error('Erro ao salvar dados de teste:', error);
            }
        }
        
        function checkLocalStorage() {
            console.log('Verificando localStorage...');
            try {
                const data = localStorage.getItem('paymentOrderData');
                console.log('Dados no localStorage:', !!data);
                if (data) {
                    console.log('Conteúdo:', JSON.parse(data));
                } else {
                    console.log('LocalStorage vazio para paymentOrderData');
                }
                
                // Listar todos os itens do localStorage
                console.log('Todos os itens no localStorage:');
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    console.log(`- ${key}:`, localStorage.getItem(key)?.substring(0, 50) + '...');
                }
            } catch (error) {
                console.error('Erro ao verificar localStorage:', error);
            }
        }
        
        function clearLocalStorage() {
            console.log('Limpando localStorage...');
            try {
                localStorage.removeItem('paymentOrderData');
                console.log('paymentOrderData removido do localStorage');
                
                // Listar itens restantes
                console.log('Itens restantes no localStorage:');
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    console.log(`- ${key}`);
                }
            } catch (error) {
                console.error('Erro ao limpar localStorage:', error);
            }
        }
        
        // Carregar quando a página estiver pronta
        document.addEventListener('DOMContentLoaded', loadPageInfo);
        
        // Impedir saída da página
        window.addEventListener('beforeunload', function(e) {
            console.log('Tentativa de sair da página detectada!');
            e.preventDefault();
            e.returnValue = '';
        });
    </script>
</body>
</html>
