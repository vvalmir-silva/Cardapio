<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Pedidos</title>
  <link rel="stylesheet" href="./styles/output.css" />
  
  <!-- Configuração da API -->
  <script>
    // Configuração da URL da API baseada no ambiente
    window.API_BASE_URL = window.location.hostname === 'localhost' 
      ? 'http://localhost:3001' 
      : 'https://cardapio-api.vercel.app'; // Substitua pela URL real da sua API
  </script>
  
  <style>
    .painel-box { 
      margin: 1rem auto; 
      max-width: 95%; 
      width: 100%; 
      background: #fff; 
      border-radius: 12px; 
      box-shadow: 0 2px 12px rgba(0,0,0,0.1); 
      padding: 1.5rem; 
    }
    
    .pedido-row { 
      display: flex; 
      flex-direction: column; 
      gap: 1rem;
      align-items: stretch; 
      justify-content: space-between; 
      border-bottom: 1px solid #eee; 
      padding: 1rem 0; 
    }
    
    .pedido-row:last-child { border-bottom: none; }
    
    .pedido-info { 
      flex: 1; 
      margin-bottom: 0.5rem;
    }
    
    .pedido-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: stretch;
    }
    
    @media (min-width: 640px) {
      .painel-box { 
        margin: 2rem auto; 
        max-width: 700px; 
        padding: 2rem; 
      }
      
      .pedido-row { 
        flex-direction: row; 
        align-items: center;
        gap: 0;
      }
      
      .pedido-info { 
        margin-bottom: 0;
      }
      
      .pedido-actions {
        flex-direction: row;
        align-items: center;
        gap: 1rem;
      }
    }
    
    .status-select { 
      padding: 0.5rem 0.7rem; 
      border-radius: 6px; 
      border: 1px solid #ccc; 
      font-size: 0.9rem;
    }
    
    .btn { 
      padding: 0.5rem 1.2rem; 
      border-radius: 6px; 
      background: #dc2626; 
      color: #fff; 
      border: none; 
      cursor: pointer; 
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    
    .btn:hover { background: #b91c1c; }
    
    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    .refresh-info {
      font-size: 0.8rem;
      color: #666;
      text-align: center;
      margin-top: 1rem;
    }
    
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #666;
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #dc2626;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 0.5rem;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen py-4">
  <div class="painel-box">
    <div class="header-info">
      <h1 class="text-2xl font-bold">Painel de Pedidos</h1>
      <div id="last-update" class="text-sm text-gray-500">
        <span class="loading"></span>Atualizando...
      </div>
    </div>
    <div id="pedidos-list"></div>
    <div class="refresh-info">Os pedidos são atualizados automaticamente a cada 10 segundos</div>
  </div>
  <script>
    // Verifica login via query string
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }
    const usuario = getQueryParam('usuario');
    const senha = getQueryParam('senha');
    if (usuario !== 'admin' || senha !== '1234') {
      document.body.innerHTML = '<div class="flex flex-col items-center justify-center min-h-screen px-4"><div class="bg-white rounded-lg shadow-lg p-8 text-center max-w-md w-full"><h2 class="text-2xl font-bold text-red-600 mb-4">Acesso negado</h2><p class="text-gray-700 mb-4">Usuário ou senha inválidos.</p><button onclick="window.location.href=\'index.html\'" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">Voltar</button></div></div>';
    } else {
      let isLoading = false;
      
      function updateLastUpdateTime() {
        const lastUpdateEl = document.getElementById('last-update');
        if (lastUpdateEl) {
          const now = new Date();
          lastUpdateEl.innerHTML = `Última atualização: ${now.toLocaleTimeString('pt-BR')}`;
        }
      }
      
      function showLoading() {
        const pedidosList = document.getElementById('pedidos-list');
        pedidosList.innerHTML = '<div class="empty-state"><div class="loading"></div>Carregando pedidos...</div>';
      }
      
      function carregarPedidos() {
        if (isLoading) return;
        isLoading = true;
        
        fetch(`${window.API_BASE_URL}/api/all-orders`)
          .then(res => {
            if (!res.ok) throw new Error('Erro ao carregar pedidos');
            return res.json();
          })
          .then(data => {
            const pedidosList = document.getElementById('pedidos-list');
            pedidosList.innerHTML = '';
            
            if (!data.length) {
              pedidosList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox text-4xl text-gray-300 mb-4"></i><p class="text-lg font-medium mb-2">Nenhum pedido encontrado</p><p class="text-sm text-gray-500">Os pedidos aparecerão aqui quando forem realizados</p></div>';
              updateLastUpdateTime();
              isLoading = false;
              return;
            }
            
            // Ordenar pedidos por data (mais recentes primeiro)
            data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            data.forEach(pedido => {
              let detalhes = '';
              try {
                const d = JSON.parse(pedido.details);
                detalhes = `<div class="text-sm text-gray-600 mt-1">Nome: ${d.nome || 'N/A'} | Tel: ${d.telefone || 'N/A'}</div>`;
              } catch {
                detalhes = '<div class="text-sm text-gray-500 mt-1">Detalhes não disponíveis</div>';
              }
              
              const statusColors = {
                'Recebido': 'bg-yellow-100 text-yellow-800',
                'Em preparo': 'bg-blue-100 text-blue-800', 
                'Pronto': 'bg-green-100 text-green-800',
                'Finalizado': 'bg-gray-100 text-gray-800'
              };
              
              const row = document.createElement('div');
              row.className = 'pedido-row';
              row.innerHTML = `
                <div class="pedido-info">
                  <div class="flex items-center gap-2 mb-1">
                    <strong class="text-lg">${pedido.code}</strong>
                    <span class="px-2 py-1 rounded-full text-xs font-medium ${statusColors[pedido.status] || 'bg-gray-100 text-gray-800'}">${pedido.status}</span>
                  </div>
                  <div class="text-sm text-gray-500">${new Date(pedido.created_at).toLocaleString('pt-BR')}</div>
                  ${detalhes}
                </div>
                <div class="pedido-actions">
                  <select class="status-select" data-code="${pedido.code}">
                    <option value="Recebido" ${pedido.status==='Recebido'?'selected':''}>Recebido</option>
                    <option value="Em preparo" ${pedido.status==='Em preparo'?'selected':''}>Em preparo</option>
                    <option value="Pronto" ${pedido.status==='Pronto'?'selected':''}>Pronto</option>
                    <option value="Finalizado" ${pedido.status==='Finalizado'?'selected':''}>Finalizado</option>
                  </select>
                  <button class="btn" data-code="${pedido.code}">Atualizar</button>
                </div>
              `;
              
              const select = row.querySelector('.status-select');
              const btn = row.querySelector('.btn');
              
              btn.onclick = function() {
                const code = this.dataset.code;
                const statusSelect = document.querySelector(`.status-select[data-code="${code}"]`);
                
                // Desabilitar botão durante a requisição
                this.disabled = true;
                this.innerHTML = '<span class="loading"></span>Atualizando...';
                
                fetch(`${window.API_BASE_URL}/api/orders/${code}`, {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ status: statusSelect.value })
                })
                .then(res => {
                  if (!res.ok) throw new Error('Erro ao atualizar');
                  return res.json();
                })
                .then(() => {
                  carregarPedidos(); // Recarregar a lista
                })
                .catch(error => {
                  console.error('Erro:', error);
                  this.disabled = false;
                  this.innerHTML = 'Atualizar';
                  alert('Erro ao atualizar status. Tente novamente.');
                });
              };
              
              pedidosList.appendChild(row);
            });
            
            updateLastUpdateTime();
            isLoading = false;
          })
          .catch(error => {
            console.error('Erro:', error);
            const pedidosList = document.getElementById('pedidos-list');
            pedidosList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle text-4xl text-red-300 mb-4"></i><p class="text-lg font-medium text-red-600 mb-2">Erro ao carregar pedidos</p><p class="text-sm text-gray-500">Verifique sua conexão e tente novamente</p><button onclick="carregarPedidos()" class="mt-4 px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">Tentar novamente</button></div>';
            isLoading = false;
          });
      }
      
      // Carregar pedidos imediatamente
      showLoading();
      carregarPedidos();
      
      // Atualizar a cada 10 segundos
      setInterval(carregarPedidos, 10000);
    }
  </script>
</body>
</html>
